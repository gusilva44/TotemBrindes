name: Publish Images

on:
  workflow_dispatch:
    inputs:
      component:
        description: Imagem a publicar
        type: choice
        required: true
        default: both
        options:
          - backend
          - frontend
          - both

permissions:
  contents: read

env:
  REGISTRY: gru.ocir.io

jobs:
  escolher:
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.pick.outputs.components }}
    steps:
      - uses: actions/github-script@v9
        id: pick
        env:
          COMPONENT: ${{ inputs.component }}
        with:
          script: |
            const { COMPONENT } = process.env
            const components =
              COMPONENT === 'both' ? ['backend', 'frontend'] : [COMPONENT]
            core.setOutput('components', JSON.stringify(components))

  publish:
    needs: escolher
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.escolher.outputs.components) }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.OCIR_USERNAME }}
          password: ${{ secrets.OCIR_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ vars.OCIR_NAMESPACE }}/totembrindes-${{ matrix.component }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: ./${{ matrix.component }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max

      - uses: actions/checkout@v7
        with:
          repository: guarnz/oke-apps
          token: ${{ secrets.GITOPS_TOKEN }}
          path: oke-apps

      - name: Pin image tag no manifest
        env:
          MANIFEST: oke-apps/gitops/config/totembrindes/${{ matrix.component }}/manifests/deployment.yaml
          IMAGE: ${{ env.REGISTRY }}/${{ vars.OCIR_NAMESPACE }}/totembrindes-${{ matrix.component }}@${{ steps.build.outputs.digest }}
        run: yq -i '.spec.template.spec.containers[0].image = strenv(IMAGE)' "$MANIFEST"

      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITOPS_TOKEN }}
          path: oke-apps
          branch: bump/totembrindes-${{ matrix.component }}
          base: main
          commit-message: "deploy(totembrindes): ${{ matrix.component }} ${{ steps.meta.outputs.version }}"
          title: "deploy(totembrindes): ${{ matrix.component }} ${{ steps.meta.outputs.version }}"
          body: |
            Publicado por [`${{ github.workflow }}`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) a partir de `${{ github.repository }}@${{ github.sha }}`.

            - Componente: `${{ matrix.component }}`
            - Digest: `${{ steps.build.outputs.digest }}`
          delete-branch: true

      - uses: actions/github-script@v9
        env:
          COMPONENT: ${{ matrix.component }}
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        with:
          script: |
            const { COMPONENT, TAGS, DIGEST } = process.env
            const pinned = TAGS.split('\n').find(t => t.includes(':sha-')) ?? ''
            await core.summary
              .addHeading(`${COMPONENT}`, 3)
              .addRaw('Imagem publicada.')
              .addCodeBlock(`tag:    ${pinned}\ndigest: ${DIGEST}`, 'text')
              .write()
