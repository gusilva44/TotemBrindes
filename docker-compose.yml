services:

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    ports:
      - "3001:3001"
    environment:
      - CHOKIDAR_USEPOLLING=true
      # O .env do frontend é ignorado no build; defina a porta do CRA no container.
      - PORT=3001
      - HOST=0.0.0.0
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    restart: unless-stopped
